amcl:
  ros__parameters:
    use_sim_time: true

    # Phase 7E is a TurtleBot3 differential-drive simulation baseline only.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 0.20

    # Standard Nav2 differential-drive motion-noise baseline.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Likelihood-field laser model constrained to the real simulated scan.
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 3.50
    laser_likelihood_max_dist: 0.50
    max_beams: 60
    sigma_hit: 0.20
    lambda_short: 0.10
    z_hit: 0.50
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.50
    do_beamskip: false
    beam_skip_distance: 0.50
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90

    # Default adaptive particle population. The lower motion update thresholds
    # are fixed before runtime because the accepted traversal is only 0.10 m/s
    # and the Phase 7E contract requires continuous low-speed tracking.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.01
    update_min_a: 0.01
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Initial pose is deliberately supplied exactly once on /initialpose by
    # the passive Phase 7E probe after both lifecycle nodes are active.
    set_initial_pose: false
    always_reset_initial_pose: false
    save_pose_rate: 0.5
