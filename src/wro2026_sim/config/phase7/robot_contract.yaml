phase: 7C
status: inspection_baseline

current_simulation_platform:
  name: TurtleBot3 differential drive
  authoritative_model: models/turtlebot3_burger_cam/model.sdf
  command_interface:
    topic: /cmd_vel
    type: geometry_msgs/msg/Twist
  wheel_separation_m: 0.160
  wheel_radius_m: 0.033
  steering_joint: null
  ackermann_command_adapter: null

tf_contract:
  map_to_odom:
    expected_in_phase7c: false
    future_authority: SLAM during mapping or AMCL during localization
  odom_to_base_footprint:
    source: gz-sim-diff-drive-system through ros_gz_bridge
    dynamic: true
  base_footprint_to_base_link:
    source: robot_state_publisher
    dynamic: false
  sensor_frames:
    lidar: base_scan
    camera_body: camera_link
    camera_optical: camera_optical_frame
    imu: imu_link

target_v550_platform:
  name: V550 Ackermann
  raw_body_size_m: [0.280, 0.190]
  design_envelope_m: [0.300, 0.210, 0.230]
  wheelbase_m: null
  front_track_width_m: null
  rear_track_width_m: null
  steering_joint_positions: null
  steering_angle_limits_rad: null
  front_overhang_m: null
  rear_overhang_m: null
  minimum_turning_radius_m: null
  lidar_extrinsics: null
  camera_extrinsics: null
  imu_extrinsics: null
  ackermann_sweep_status: BLOCKED
