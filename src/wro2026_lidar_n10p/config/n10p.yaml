# N10P scan node parameters (node name: n10p_scan). READ ONLY node.
# Defaults in scan_node.py PARAMETERS must stay identical to this file.
n10p_scan:
  ros__parameters:
    port: ''                     # REQUIRED: ls -l /dev/serial/by-id/
    baud: 460800                 # official LSLIDAR driver, N10_P
    frame_id: laser_link
    bins: 480                    # 0.75 deg; at 10 Hz the lidar gives ~533 points/rev (~0.68 deg), so
                                 # 720 bins left ~40 % empty (2026-10-17). Keep constant (slam_toolbox)
    range_min: 0.1               # m
    range_max: 25.0              # m (N10P spec: 25 m on white targets)
    angle_offset_deg: 0.0        # lidar zero vs laser_link x axis: check with /scan
    range_offset_m: 0.036        # subtracted from every distance: tape vs lidar centre 2026-11-19 read +3.2 cm at 0.575 m, +4.0 cm at 0.975 m (README)
    scan_timeout: 1.0            # s
    echo2_topic: 'scan_echo2'    # the second echo as a LaserScan ('' = off); /scan carries the first echo's intensities (2026-11-27)
    mask_sectors_deg: '168:178,195:213,228:247'  # hide our own car (ROS deg, 0 = front, CCW); measured 2026-11-08, see README; 243 -> 247 on 11-20 (a part at 243-245 deg, raw 0.136 m, falls on the car outline after range_offset_m). Re-measure after moving cables
