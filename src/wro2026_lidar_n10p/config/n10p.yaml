# N10P scan node parameters (node name: n10p_scan). READ ONLY node.
# Defaults in scan_node.py PARAMETERS must stay identical to this file.
n10p_scan:
  ros__parameters:
    port: ''                     # REQUIRED: ls -l /dev/serial/by-id/
    baud: 460800                 # official LSLIDAR driver, N10_P
    frame_id: laser_link
    bins: 720                    # 0.5 deg per beam; keep constant (slam_toolbox)
    range_min: 0.1               # m
    range_max: 25.0              # m (N10P spec: 25 m on white targets)
    angle_offset_deg: 0.0        # lidar zero vs laser_link x axis: check with /scan
    scan_timeout: 1.0            # s
