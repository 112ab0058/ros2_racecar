# slam_toolbox (async, online mapping) for the R550 on the 160 cm field. READ ONLY: it only
# reads /scan + TF and publishes /map and TF map -> odom. Used by launch/slam.launch.py for
# the simulation (use_sim_time) and the real car (hand-push mapping, Motor OFF).
# Frames like ekf.yaml: the EKF publishes odom -> base_link, slam publishes map -> odom.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02    # s, map -> odom
    map_update_interval: 1.0          # s
    resolution: 0.02                  # m per cell: lanes are 0.6 m, lidar noise ~8 mm
    min_laser_range: 0.12             # N10P minimum ~0.1 m
    max_laser_range: 4.0              # field is 1.6 m; ignore far returns outside it
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # matching: add a scan every 10 cm or 6 deg, and let the (good) EKF odometry pull the
    # match harder (variance / minimum penalties below). Sim 2026-10-21, 1 lap: every 5 cm /
    # 3 deg with the default penalties drifted -4.5 deg (the square field is very
    # self-similar); this setting: 0.008 m / -0.8 deg, all map cells within 4 cm of a wall.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 1.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.2
    angle_variance_penalty: 0.3
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.5
    minimum_distance_penalty: 0.3
    use_response_expansion: true
