# robot_localization EKF for the R550 (2D). Started by localization.launch.py.
# Output: /odometry/filtered and TF odom -> base_link (so r550_feedback /
# r550_base must run with publish_odom_tf: false; the launch files do that).
#
# The 15 booleans of each *_config, in this order:
#   x,  y,  z,     roll, pitch, yaw,
#   vx, vy, vz,    vroll, vpitch, vyaw,
#   ax, ay, az
# We fuse VELOCITIES, not two absolute headings (they would fight each other):
#   odom: vx (wheels) + vy = 0 (Ackermann cannot slide sideways)
#   imu:  vyaw (gyro z) only; accel is zeroed by the firmware at boot, not used
# odom vyaw is OFF until the turn test (DETAILED_PLAN 7.3) verifies wz_scale.
# Covariances come from the messages: odom twist (r550_feedback.yaml),
# gyro 1e-6 (measured still 2026-10-19, x7 margin).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0              # Hz; sensors are 20 Hz
    sensor_timeout: 0.2          # s; predict only when a sensor is silent this long
    two_d_mode: true             # plane only: z, roll, pitch forced to 0
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom            # continuous local estimate (AMCL / slam give map -> odom)

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
