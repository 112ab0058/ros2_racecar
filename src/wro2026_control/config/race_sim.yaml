# Race controller parameters for the Gazebo TurtleBot3 model.
# Every field of wro2026_control.core.Params can be set here; anything not
# listed keeps its default.  Floats must be written with a decimal point.
race_controller:
  ros__parameters:
    # driving
    cruise_speed: 0.12          # m/s on straights
    avoid_speed: 0.07           # m/s when the planned path passes close to something
    laps: 3
    corners_per_lap: 4

    # robot footprint (TurtleBot3 burger: LiDAR 3.2 cm behind base_footprint)
    lidar_x: -0.032
    body_front: 0.07
    body_rear: 0.07
    half_width: 0.09

    # steering-wheel car: set to its minimum turning radius (m); 0 = differential
    min_turn_radius: 0.0

    # node
    control_rate: 20.0
    sensor_timeout: 0.5
    max_linear: 0.20
